name: tests

# Nothing here has dependencies, so there is nothing to install: check out,
# pick a Node version, run the test files. The file keeps its first name so
# the badge URL in the README stays valid.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node hooks/test/commit-guards.test.mjs
      - run: node hooks/test/new-guards.test.mjs
      - run: node hooks/test/ci-gate.test.mjs
      - run: node hooks/test/fail-closed.test.mjs
      - run: node library/tools/build-index.test.mjs
      # The committed example index must match what the builder generates.
      - run: node library/tools/build-index.mjs --check
