name: hook tests

# The guard hooks have no dependencies, so there is nothing to install: check
# out, pick a Node version, run the four test files.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node hooks/test/commit-guards.test.mjs
      - run: node hooks/test/new-guards.test.mjs
      - run: node hooks/test/ci-gate.test.mjs
      - run: node hooks/test/fail-closed.test.mjs
